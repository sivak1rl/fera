# Common configuration anchors
x-service-common: &service-common
  restart: unless-stopped
  networks:
    - fera_network

services:
  # Frontend - Local
  frontend_local:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: fera_frontend_local:latest
    container_name: fera_frontend_local
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_ENV=development
      - NODE_ENV=development
      - API_URL=http://api.fera_local.net:5000
    ports:
      - "5173:5173"
    networks:
      - fera_network
    extra_hosts:
      - "fera_local.net:10.0.96.68"
      - "api.fera_local.net:10.0.96.68"
    profiles:
      - local
    depends_on:
      - backend_local
  
  # Backend - Local
  backend_local:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    image: fera_backend_local:latest
    container_name: fera_backend_local
    volumes:
      - ./backend:/app
    environment:
      - FLASK_ENV=development
      - DB_HOST=database
      - DB_USER=${DB_USER:-ferauser}
      - DB_PASSWORD=${DB_PASSWORD:-ferapass}
      - DB_NAME=${DB_NAME:-fera_local}
      - REDIS_HOST=redis
    ports:
      - "5000:5000"
    networks:
      - fera_network
    extra_hosts:
      - "fera_local.net:10.0.96.68"
      - "api.fera_local.net:10.0.96.68"
    profiles:
      - local
    depends_on:
      - database
      - redis
  
  #######################################
  # SHARED SERVICES
  #######################################
  
  # Database
  database:
    image: postgres:14-alpine
    container_name: fera_database
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DB_USER:-ferauser}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-ferapass}
      - POSTGRES_DB=${DB_NAME:-fera}
    <<: *service-common
  
  # Redis
  redis:
    image: redis:7-alpine
    container_name: fera_redis
    volumes:
      - redis_data:/data
    <<: *service-common

volumes:
  postgres_data:
  redis_data:
  
networks:
  fera_network:
    name: fera_network
    driver: bridge